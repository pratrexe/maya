<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Margin OS</title>

  <style>
    :root {
      --paper: #f4efdf;
      --ink: #292720;
      --accent: #345bd8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe Print", "Bradley Hand", cursive;
    }

    /* A faint dotted-paper desktop */
    .desktop {
      flex: 1;
      min-height: 0;
      padding: 32px;
      background-image: radial-gradient(
        #29272020 1px,
        transparent 1px
      );
      background-size: 24px 24px;
    }

    .title {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 14px;
    }

    /* Slightly uneven edges give it a drawn feel */
    .taskbar {
      margin: 0 14px 14px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 2px solid var(--ink);
      border-radius: 8px 13px 7px 11px;
      background: var(--paper);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .brand {
      font-weight: bold;
      color: var(--accent);
    }

    .status {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="desktop">
    <h1 class="title">Margin OS</h1>
    <p class="subtitle">a little room for your ideas.</p>
  </main>

  <footer class="taskbar" aria-label="Desktop status">
    <span class="brand">margin ✳</span>
    <span class="status">a blank beginning.</span>
  </footer>
</body>
</html>
